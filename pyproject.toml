[tool.poetry]
name = "pythonQEPest"
version = "1.1.2"
description = ""
authors = ["Lina <knocker767@gmail.com>"]
readme = "README.md"
packages = [
    { include = "pythonQEPest" }
]
[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pydantic = "2.10.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pre-commit = "^4.2.0"
pyinstaller = "^6.15.0"
poethepoet = "^0.36.0"

[tool.poetry.group.ui.dependencies]
pyperclip = "^1.9.0"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools>=40.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
build-simple = "pyinstaller --onefile pythonQEPest/main.py"
build-gui = "pyinstaller --onefile --noconsole pythonQEPest/gui/gui.py"