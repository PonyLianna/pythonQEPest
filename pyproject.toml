[tool.poetry]
name = "pythonqepest"
version = "1.0.0"
description = ""
authors = ["Lina <knocker767@gmail.com>"]
readme = "README.md"
packages = [
    { include = "pythonqepest.py", to = "pythonQEPest" },
    {include = "QEPestData.py", from = "dto", to = "pythonQEPest/dto"},
    {include = "QEPestInput.py", from = "dto", to = "pythonQEPest/dto"},
    {include = "QEPestOutput.py", from = "dto", to = "pythonQEPest/dto"},
    {include = "check_nan.py" , from = "helpers", to = "pythonQEPest/helpers"},
    {include = "get_num_of_cols.py" , from = "helpers", to = "pythonQEPest/helpers"},
    {include = "get_values_from_line.py" , from = "helpers", to = "pythonQEPest/helpers"}
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "2.7.1"


[build-system]
requires = ["poetry-core>=1.0.0", "setuptools>=40.8.0"]
build-backend = "poetry.core.masonry.api"
