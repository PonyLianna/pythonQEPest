# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --with dev --extras "rdkit gui" --no-interaction
      - name: Test with pytest (coverage)
        run: poetry run pytest -q --cov=pythonQEPest --cov-report=term-missing --cov-fail-under=40
      - name: Build release distributions
        run: poetry build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-24.04
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pyinstaller:
    needs: release-build
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --with dev --extras "rdkit gui" --no-interaction
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $ver = poetry version -s
          echo "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Build CLI executable
        run: poetry run pyinstaller main.spec
      - name: Build GUI executable
        run: poetry run pyinstaller gui.spec
      - name: Rename executables with version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          if ("${{ matrix.os }}" -match "windows") {
            Move-Item dist/pythonQEPest.exe pythonQEPest-$ver-win64.exe
            Move-Item dist/pythonQEPest-GUI.exe pythonQEPest-GUI-$ver-win64.exe
          } else {
            Move-Item dist/pythonQEPest pythonQEPest-$ver-linux
            Move-Item dist/pythonQEPest-GUI pythonQEPest-GUI-$ver-linux
          }
      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: pythonQEPest*
          if-no-files-found: error

  release:
    needs: [pypi-publish, pyinstaller]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
      - name: List uploaded files
        run: Get-ChildItem -Recurse artifacts